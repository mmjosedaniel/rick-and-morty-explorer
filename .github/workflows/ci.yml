name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      POSTGRES_PORT: "55432"
      REDIS_PORT: "56379"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install npm 11.16.0
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Type-check source
        run: npm run typecheck

      - name: Build applications
        run: npm run build

      - name: Validate Tailwind output
        run: npm run validate:tailwind

      - name: Run test suite
        run: npm test

      - name: Verify smoke lifecycle
        run: npm run test:smoke:lifecycle

      - name: Validate infrastructure configuration
        run: npm run infra:config

      - name: Start infrastructure
        run: npm run infra:up

      - name: Inspect infrastructure health
        run: npm run infra:ps

      - name: Tear down infrastructure
        if: always()
        run: npm run infra:down
